name: test-build-deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false      # never cut a deployment in half

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bot logic tests
        run: |
          gcc -std=gnu11 -Iinclude -o bot_logic_test tests/bot_logic_test.c \
            src/log.c src/protocol.c src/des.c src/map_point.c src/command.c src/config.c src/guildbank.c
          ./bot_logic_test
      - name: Console compiles
        run: python3 -m py_compile webui/server.py webui/store.py webui/schema.py webui/config_file.py webui/guild_bank.py
      - name: Console guild bank tests
        run: python3 tests/webui_bank_test.py

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest

  deploy:
    needs: image
    # runs directly on the Debian server via a self-hosted runner: no inbound port needed,
    # the runner only opens an outbound HTTPS connection to GitHub to poll for jobs.
    runs-on: self-hosted
    env:
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
    steps:
      - name: Update the server
        run: |
          cd ~/lords-mobile-bot
          git fetch --quiet origin
          git reset --hard "$GITHUB_SHA"
          YES=1 LMBOT_IMAGE="$IMAGE" deploy/deploy.sh upgrade
